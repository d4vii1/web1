<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Média</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <div class="cabecalho">
            <h1>Calculadora de Média</h1>
            <p>Adicione até 20 notas</p>
        </div>

        <div id="notas" class="notas">

            <div class="nota">
                <label>Nota 1</label>

                <input
                    id="nota1"
                    type="number"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="Digite a nota"
                >

                <button class="btn-excluir" onclick="excluirNota(this)">
                    Excluir
                </button>
            </div>

            <div class="nota">
                <label>Nota 2</label>

                <input
                    id="nota2"
                    type="number"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="Digite a nota"
                >

                <button class="btn-excluir" onclick="excluirNota(this)">
                    Excluir
                </button>
            </div>

        </div>

        <button class="btn-adicionar" onclick="adicionarNota()">
            + Adicionar nota
        </button>

        <button class="btn-calcular" onclick="calcularMedia()">
            Calcular média
        </button>

        <div class="resultado">

            <h2>Resultado</h2>

            <p id="media">Média: --</p>

            <p id="situacao">Situação: --</p>

        </div>

    </div>

</body>

</html>
