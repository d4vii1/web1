<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo Digital</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <canvas id="fumaca"></canvas>

  <main class="oraculo">
    <span class="olho">◈</span>
    <h1 data-text="O Oráculo Digital">O Oráculo Digital</h1>
    <p class="subtitulo">Diga seu nome e o número que a sorte te sussurrou</p>

    <div class="formulario">
      <div class="campo">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" placeholder="Ex: Davi">
      </div>

      <div class="campo">
        <label for="numero">Seu número da sorte</label>
        <input type="number" id="numero" placeholder="Ex: 17">
      </div>

      <button id="botaoConsultar">Consultar o Oráculo</button>
    </div>

    <div class="terminal" id="terminal">
      <p class="linha-terminal linha-aguardando">&gt; aguardando dados do consulente...</p>
    </div>

    <div class="resultado" id="resultado"></div>

    <footer class="rodape">Oráculo criado por Davi Dias e João Vitor</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
