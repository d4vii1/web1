<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Tabuada</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <main class="caixa">
    <div class="lousa">
      <h1>Gerador de Tabuada</h1>
      <p class="subtitulo">Digite um número e veja a tabuada de 1 a 10</p>

      <div class="formulario">
        <label for="numero">Número</label>
        <input type="number" id="numero" placeholder="Ex: 5">
        <button id="botaoGerar">Gerar tabuada</button>
      </div>

      <ul class="resultado" id="resultado"></ul>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
